<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Management Flashcards</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Filters</h2>
            <button class="close-btn" id="close-sidebar-btn">&times;</button>
        </div>
        
        <div class="user-section" id="user-section">
            <p id="user-info" class="user-info-text">Not logged in</p>
            <button class="btn btn-secondary btn-small" id="login-btn">Login / Sign Up</button>
            <button class="btn btn-secondary btn-small" id="logout-btn" style="display: none;">Log Out</button>
            <button class="btn btn-primary btn-small" id="force-sync-btn" style="display: none; margin-top: 10px; width: 100%;">Sync Local to Cloud</button>
        </div>
        <hr class="sidebar-divider">

        <ul class="filter-list">
            <li class="filter-item active" data-filter="all">All Cards</li>
            <li class="filter-item" data-filter="unrated">Unrated</li>
            <li class="filter-item" data-filter="hard">Hard</li>
            <li class="filter-item" data-filter="medium">Medium</li>
            <li class="filter-item" data-filter="easy">Easy</li>
        </ul>
    </div>

    <div class="container">
        <header>
            <button class="menu-btn btn-icon" id="menu-btn" title="Menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <h1>FM Flashcards</h1>
            <div id="sync-indicator" class="sync-indicator" style="display: none; position: absolute; right: 15px; top: 20px; font-size: 0.8rem; background: rgba(255,255,255,0.2); padding: 4px 8px; border-radius: 12px; font-weight: 600;">Syncing...</div>
            <div class="progress" id="progress-text">Card 1 / 10</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </header>

        <div class="card-container" id="card-container">
            <div class="flashcard" id="flashcard">
                <div class="card-face card-front">
                    <div class="card-content">
                        <span class="label">QUESTION <span id="confidence-badge" class="badge"></span></span>
                        <h2 id="question-text">Loading...</h2>
                    </div>
                </div>
                <div class="card-face card-back">
                    <div class="card-content">
                        <span class="label">ANSWER</span>
                        <div id="answer-text" class="answer-scroll"></div>
                        <div class="confidence-controls" id="confidence-controls">
                            <p>How well did you know this?</p>
                            <div class="confidence-buttons">
                                <button class="btn-conf btn-easy" data-level="easy">Easy</button>
                                <button class="btn-conf btn-medium" data-level="medium">Medium</button>
                                <button class="btn-conf btn-hard" data-level="hard">Hard</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-icon" id="prev-btn" title="Previous Card">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <button class="btn btn-primary" id="flip-btn">Flip Card</button>
            <button class="btn btn-icon" id="next-btn" title="Next Card">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
        </div>
        
        <div class="extra-controls">
            <button class="btn btn-secondary" id="shuffle-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
                Shuffle Cards
            </button>
        </div>
    </div>

    <div class="modal-overlay" id="auth-modal">
        <div class="modal">
            <h2>Account Sync</h2>
            <p class="modal-desc">Log in or create an account to sync your confidence levels across all your devices.</p>
            <input type="email" id="email-input" placeholder="Email" class="input-field">
            <input type="password" id="password-input" placeholder="Password" class="input-field">
            <p id="auth-error" class="error-text"></p>
            <div class="modal-buttons">
                <button class="btn btn-primary" id="signin-btn">Login</button>
                <button class="btn btn-secondary" id="signup-btn">Sign Up</button>
            </div>
            <button class="close-modal-btn" id="close-modal-btn">&times;</button>
        </div>
    </div>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
